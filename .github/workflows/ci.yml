# Проверки на каждую отправку.
#
# Устроены веером: разбор кода, проверка каталога, проверки на двух системах
# и сборка. Порядок задач не связан — падать они должны независимо, чтобы за
# один прогон было видно всё сразу, а не первую же ошибку.
#
# Каталог проверяется отдельной задачей не для красоты: он правится чаще
# кода, а ошибка в нём стоит столько же — лишняя маска отбирает у человека
# нужную программу.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  lint:
    name: Разбор кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Стиль
        run: ruff check --output-format=github .
      - name: Оформление
        run: ruff format --check .
      - name: Типы
        # Проверяем как Windows: иначе winreg и ctypes.WinDLL для проверки не
        # существуют, и вся платформенная половина остаётся без разбора.
        run: mypy

  catalog:
    name: Каталог целей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Проверить файлы каталога
        run: python tools/validate_catalog.py

  test:
    name: Проверки (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Прогон
        run: pytest --cov=strazh --cov-report=term-missing --cov-report=xml
      - name: Сохранить покрытие
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  gui:
    name: Окно на подставном экране
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Поставить tkinter и Xvfb
        # Берём системный Python: сборки actions/setup-python зависят от
        # библиотек Tk, которых на образе может не оказаться, а системный
        # python3-tk ставится одной строкой и работает наверняка.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
      - name: Поднять окно и переключить разделы
        run: xvfb-run -a python3 tools/gui_smoke.py

  build:
    name: Сборка для Windows
    runs-on: windows-latest
    needs: [lint, test]
    # Проверка установки ставит и удаляет программу по-настоящему. Если она
    # где-то встанет — а встать она может на окне, которого некому нажать, —
    # задача обязана упасть, а не занимать машину сборки полдня.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[build]"
      - name: Собрать
        run: pyinstaller --noconfirm --clean packaging/strazh.spec
      - name: Проверить, что собранное запускается
        # Собранная программа обязана хотя бы отвечать на `--version`: иначе
        # выяснится, что в неё не попал каталог, уже после выпуска.
        run: |
          dist\strazh-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "собранная программа не запустилась" }
          dist\strazh-cli.exe list --category stalkerware
          if ($LASTEXITCODE -ne 0) { throw "в сборку не попал каталог" }
          foreach ($name in 'Strazh.exe', 'strazh-cli.exe', 'strazh-deny.exe') {
            if (-not (Test-Path "dist\$name")) { throw "не собран $name" }
          }
        shell: pwsh
      - name: Узнать версию
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); from strazh.version import __version__; print(__version__)"
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup нет в образе — ставлю"
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки" }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} packaging\strazh.iss
          if ($LASTEXITCODE -ne 0) { throw "установщик не собрался" }
          Get-ChildItem dist\installer

      - name: Установить, проверить, удалить
        # Главное обещание установщика — что удаление снимает изменения в
        # системе, а не просто стирает файлы. Проверяется оно единственным
        # честным способом: программа ставится по-настоящему, вместе с
        # заданием наблюдения и включённой защитой, а потом удаляется, и
        # проверяется, что от неё не осталось ни задания, ни перехватов
        # запуска в реестре. Иначе об этом узнал бы человек, а не сборка.
        shell: pwsh
        run: |
          $ifeo = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\360tray.exe"
          $setup = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName

          Start-Process -FilePath $setup -Wait -ArgumentList `
            '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES','/TASKS=autostart,applynow'

          $cli = "$env:ProgramFiles\Strazh\strazh-cli.exe"
          if (-not (Test-Path $cli)) { throw "установщик не положил файлы" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "установленная программа не запускается" }

          schtasks /Query /TN Strazh | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "задание наблюдения не заведено" }
          if (-not (Test-Path $ifeo)) { throw "защита не применилась: нет перехвата запуска" }
          Write-Host "установка: файлы, задание и защита на месте"

          $uninstaller = (Get-ChildItem "$env:ProgramFiles\Strazh\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $uninstaller -Wait -ArgumentList `
            '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES'
          Start-Sleep -Seconds 10

          if (Test-Path "$env:ProgramFiles\Strazh\strazh-cli.exe") { throw "удаление оставило файлы" }
          schtasks /Query /TN Strazh 2>$null | Out-Null
          $taskGone = $LASTEXITCODE -ne 0
          if (-not $taskGone) { throw "удаление оставило задание наблюдения" }
          if (Test-Path $ifeo) { throw "удаление оставило перехват запуска в реестре" }
          Write-Host "удаление: не осталось ни файлов, ни задания, ни изменений в системе"

          # Последней внешней командой здесь был `schtasks`, и он вернул
          # единицу — именно потому, что задания больше нет, то есть проверка
          # прошла. Оболочка же берёт код последней команды как код всего
          # шага, и успешная проверка выглядела бы провалом. Заканчиваем явно:
          # всё, что могло не сойтись, выше и бросает исключение само.
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: strazh-windows
          path: |
            dist/*.exe
            dist/installer/*.exe
          retention-days: 14
