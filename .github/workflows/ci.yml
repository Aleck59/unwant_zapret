# Проверки и выпуск — одним набором.
#
# Раньше их было два: один проверял, другой собирал выпуск. Это означало две
# копии сборки, которые расходятся, и возможность выпустить то, что не
# проходило проверок: выпуск начинался с чистого листа и повторял только
# часть шагов. Теперь выпуск — это последняя задача того же прогона, и
# добраться до неё можно только через всё остальное.
#
# Выпуск начинается тегом `v1.2.0` или кнопкой «Run workflow» с указанным
# тегом. Во всех прочих случаях набор заканчивается сборкой.
#
# PYTHONUTF8 здесь намеренно не выставлен. Он заставил бы Python работать в
# UTF-8 и на Windows — то есть в условиях, которых у человека нет. Ровно так
# однажды и вышло: проверки зеленели, а собранная программа падала на первом
# же русском слове. Проверки должны идти там же, где живёт программа.

name: Проверки и выпуск

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска, например v1.2.0. Пусто — только проверки'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Разбор кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Стиль
        run: ruff check --output-format=github .
      - name: Оформление
        run: ruff format --check .
      - name: Типы
        # Проверяем как Windows: иначе winreg и ctypes.WinDLL для проверки не
        # существуют, и вся платформенная половина остаётся без разбора.
        run: mypy

  catalog:
    name: Каталог целей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Проверить файлы каталога
        run: python tools/validate_catalog.py

  test:
    name: Проверки (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Прогон
        run: pytest --cov=strazh --cov-report=term-missing --cov-report=xml
      - name: Сохранить покрытие
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  gui:
    name: Окно на подставном экране
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Поставить tkinter и Xvfb
        # Берём системный Python: сборки actions/setup-python зависят от
        # библиотек Tk, которых на образе может не оказаться, а системный
        # python3-tk ставится одной строкой и работает наверняка.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
      - name: Поднять окно и переключить разделы
        run: xvfb-run -a python3 tools/gui_smoke.py

  build:
    name: Сборка для Windows
    runs-on: windows-latest
    needs: [lint, catalog, test, gui]
    # Проверка установки ставит и удаляет программу по-настоящему. Если она
    # где-то встанет — а встать она может на окне, которого некому нажать, —
    # задача обязана упасть, а не занимать машину сборки полдня.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[build,dev]"

      - name: Узнать версию
        id: version
        shell: pwsh
        run: |
          $inside = python -c "import sys; sys.path.insert(0,'src'); from strazh.version import __version__; print(__version__)"
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }

          if ($tag) {
            # Тег v1.2.0 и version.py, где написано 1.0.0, — обычная и очень
            # неприятная ошибка: выпуск уходит с чужим номером внутри.
            if ($tag -ne "v$inside") { throw "тег $tag, а в version.py $inside" }
            "release=true" >> $env:GITHUB_OUTPUT
          } else {
            "release=false" >> $env:GITHUB_OUTPUT
          }
          "value=$inside" >> $env:GITHUB_OUTPUT
          Write-Host "версия $inside, выпуск: $(if ($tag) { $tag } else { 'нет' })"

      - name: Собрать
        run: pyinstaller --noconfirm --clean packaging/strazh.spec

      - name: Проверить, что собранное запускается
        # Собранная программа обязана хотя бы отвечать на `--version` и
        # отдавать каталог: иначе выяснится, что в неё не попали данные, уже
        # после выпуска.
        shell: pwsh
        run: |
          dist\strazh-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "собранная программа не запустилась" }
          dist\strazh-cli.exe list --category stalkerware
          if ($LASTEXITCODE -ne 0) { throw "в сборку не попал каталог" }
          foreach ($name in 'Strazh.exe', 'strazh-cli.exe', 'strazh-deny.exe') {
            if (-not (Test-Path "dist\$name")) { throw "не собран $name" }
          }

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup нет в образе — ставлю"
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\strazh.iss
          if ($LASTEXITCODE -ne 0) { throw "установщик не собрался" }
          Get-ChildItem dist\installer

      - name: Установить, проверить, удалить
        # Главное обещание установщика — что удаление снимает изменения в
        # системе, а не просто стирает файлы. Проверяется оно единственным
        # честным способом: программа ставится по-настоящему, вместе с
        # заданием наблюдения и включённой защитой, а потом удаляется, и
        # проверяется, что от неё не осталось ни задания, ни перехватов
        # запуска в реестре. Иначе об этом узнал бы человек, а не сборка.
        shell: pwsh
        run: |
          $ifeo = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\360tray.exe"
          $setup = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName

          Start-Process -FilePath $setup -Wait -ArgumentList `
            '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES','/TASKS=autostart,applynow'

          $cli = "$env:ProgramFiles\Strazh\strazh-cli.exe"
          if (-not (Test-Path $cli)) { throw "установщик не положил файлы" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "установленная программа не запускается" }

          schtasks /Query /TN Strazh | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "задание наблюдения не заведено" }
          if (-not (Test-Path $ifeo)) { throw "защита не применилась: нет перехвата запуска" }
          Write-Host "установка: файлы, задание и защита на месте"

          $uninstaller = (Get-ChildItem "$env:ProgramFiles\Strazh\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $uninstaller -Wait -ArgumentList `
            '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES'
          Start-Sleep -Seconds 10

          if (Test-Path "$env:ProgramFiles\Strazh\strazh-cli.exe") { throw "удаление оставило файлы" }
          schtasks /Query /TN Strazh 2>$null | Out-Null
          $taskGone = $LASTEXITCODE -ne 0
          if (-not $taskGone) { throw "удаление оставило задание наблюдения" }
          if (Test-Path $ifeo) { throw "удаление оставило перехват запуска в реестре" }
          Write-Host "удаление: не осталось ни файлов, ни задания, ни изменений в системе"

          # Последней внешней командой здесь был `schtasks`, и он вернул
          # единицу — именно потому, что задания больше нет, то есть проверка
          # прошла. Оболочка же берёт код последней команды как код всего
          # шага, и успешная проверка выглядела бы провалом. Заканчиваем явно:
          # всё, что могло не сойтись, выше и бросает исключение само.
          exit 0

      - name: Упаковать
        shell: pwsh
        run: |
          $version = "v${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/*.exe -DestinationPath "release/strazh-$version-windows-x64.zip"
          Copy-Item dist/installer/*.exe release/
          Get-ChildItem release\* -Include *.zip,*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 release/SHA256SUMS.txt
          }
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: strazh-windows
          path: release/
          retention-days: 14

  publish:
    name: Запись в Releases
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: strazh-windows
          path: release
      - name: Выпустить
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Страж v${{ needs.build.outputs.version }}
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            Запрет запуска и установки нежелательного и шпионского ПО для Windows 10/11.

            **Установка.** Скачайте `strazh-setup-*.exe` и запустите. Установщик
            заведёт наблюдение с запуска системы и включит защиту; удаление
            снимет всё, что программа внесла в систему, а не просто сотрёт файлы.

            Кому нужна переносимая сборка — архив `*.zip` рядом: распакуйте и
            запустите `Strazh.exe`. Программа попросит права администратора: без
            них не завести правила запуска в общей ветке реестра.

            **Проверка загрузки.** Суммы файлов — в `SHA256SUMS.txt`.
            Собрано из исходного кода этим самым прогоном, и тем же прогоном
            проверено: программа ставится, защита применяется, удаление не
            оставляет ни задания наблюдения, ни изменений в реестре.

            **Отмена.** Всё, что программа меняет в системе, записывается в
            `state.json` и снимается кнопкой «Выключить защиту», командой
            `strazh-cli revert` или удалением программы.
          generate_release_notes: true
